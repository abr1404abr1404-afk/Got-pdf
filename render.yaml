services:
  - type: web
    name: alfalqi-pdf-ocr
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_PDF_PAGES
        value: "5"
      - key: OCR_DPI
        value: "180"
      - key: OCR_MODE
        value: tesseract
      - key: CORS_ORIGINS
        value: https://abr1404abr1404-afk.github.io
