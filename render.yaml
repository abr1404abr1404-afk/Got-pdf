services:
  - type: web
    name: alfalqi-pdf-ocr
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PDF_PAGES
        value: "12"
      - key: OCR_DPI
        value: "240"
      - key: OCR_MODE
        value: hybrid
      - key: CORS_ORIGINS
        value: https://abr1404abr1404-afk.github.io
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
