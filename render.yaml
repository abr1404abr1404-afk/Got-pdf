services:
  - type: web
    name: alfalqi-pdf-ocr
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_PDF_PAGES
        value: "5"
      - key: OCR_DPI
        value: "150"
      - key: TESSERACT_TIMEOUT_SECONDS
        value: "25"
      - key: TESSERACT_RETRY_TIMEOUT_SECONDS
        value: "12"
      - key: TESSERACT_RETRY_MAX_EDGE
        value: "800"
      - key: OCR_MAX_IMAGE_EDGE
        value: "1400"
      - key: OCR_PREPROCESS_TARGET_EDGE
        value: "1000"
      - key: OPENCV_THREADS
        value: "1"
      - key: OMP_THREAD_LIMIT
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: OCR_QUEUE_WAIT_SECONDS
        value: "120"
      - key: CPU_QUEUE_WAIT_SECONDS
        value: "90"
      - key: OCR_DENOISE
        value: "false"
      - key: PDF_NATIVE_TEXT_MIN_CHARS
        value: "30"
      # The free Docker image intentionally excludes PyTorch/PaddleOCR to stay within its memory budget.
      - key: OCR_MODE
        value: tesseract
      - key: ENABLE_PADDLE_OCR
        value: "false"
      - key: CORS_ORIGINS
        value: https://abr1404abr1404-afk.github.io
