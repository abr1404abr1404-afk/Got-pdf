services:
  - type: web
    name: alfalqi-pdf-ocr
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_PDF_PAGES
        value: "5"
      - key: OCR_DPI
        value: "180"
      - key: TESSERACT_TIMEOUT_SECONDS
        value: "55"
      - key: OCR_MAX_IMAGE_EDGE
        value: "2400"
      - key: OCR_QUEUE_WAIT_SECONDS
        value: "120"
      - key: CPU_QUEUE_WAIT_SECONDS
        value: "90"
      - key: OCR_DENOISE
        value: "false"
      - key: PDF_NATIVE_TEXT_MIN_CHARS
        value: "30"
      - key: OCR_MODE
        value: tesseract
      - key: ENABLE_PADDLE_OCR
        value: "false"
      - key: CORS_ORIGINS
        value: https://abr1404abr1404-afk.github.io
