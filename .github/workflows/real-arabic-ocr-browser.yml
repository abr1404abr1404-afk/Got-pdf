name: Real Arabic OCR browser end-to-end
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - "tests/e2e/**"
      - ".github/workflows/real-arabic-ocr-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep duplicate attempts for one commit serialized without blocking newer fixes.
  group: got-pdf-real-arabic-ocr-browser-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare authentic public Arabic PDF and image fixtures
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf
          python tests/e2e/prepare_real_fixture.py
      - name: Install API and Word conversion runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core libraqm0 libharfbuzz0b libfribidi0 tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng libreoffice-writer
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9' 'numpy>=1.26,<2' 'opencv-python-headless>=4.10,<5' 'pytesseract>=0.3.13' 'Pillow>=10.3' 'python-docx>=1.1,<2' 'pdf2docx>=0.5.8,<0.6' 'openpyxl>=3.1,<4'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/got-pdf-http.log 2>&1 &
          echo $! > /tmp/got-pdf-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/got-pdf-http.log
          exit 1
      - name: Test real PDF and image OCR through the browser UI
        run: node tests/e2e/real-arabic-ocr.spec.cjs
      - name: Test mobile zoom, floating text toolbar, and bottom-page dragging
        run: node tests/e2e/editor-interaction.spec.cjs
      - name: Test both Word export paths on a real Arabic PDF and scanned page
        run: python tests/e2e/real_pdf_to_docx.py
      - name: Upload OCR browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-arabic-ocr-browser-results
          path: |
            browser-ocr-e2e-results.json
            tests/e2e/artifacts/real-pdf-to-docx-results.json
            tests/e2e/artifacts/*.docx
            /tmp/got-pdf-http.log
          if-no-files-found: ignore
