name: Backend live smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Render backend health
        shell: bash
        run: |
          set -euo pipefail
          url="https://got-pdf.onrender.com/api/health"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -o "$body" -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "HTTP 200 from $url"
              python - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert data.get("ok") is True, "health endpoint did not report ok=true"
          assert data.get("service"), "service name missing"
          assert isinstance(data.get("tesseract_languages"), list), "OCR language inventory missing"
          assert data.get("arabic_ocr_ready") is True, "Arabic Tesseract language is not ready"
          assert data.get("english_ocr_ready") is True, "English Tesseract language is not ready"
          print("BACKEND_HEALTH_SMOKE=PASS")
          PY
              exit 0
            fi
            echo "Attempt $attempt/24: HTTP ${code:-no-response}; retrying in 10s"
            sleep 10
          done
          echo "Backend health check did not return a valid healthy response."
          [ ! -s "$body" ] || cat "$body"
          exit 1
