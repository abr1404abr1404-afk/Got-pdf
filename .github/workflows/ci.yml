name: Python checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "chore/**"]

jobs:
  syntax-and-ocr-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF test dependencies and Arabic font
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-dejavu-core libraqm0 libharfbuzz0b libfribidi0 tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng libreoffice-writer
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9' 'numpy>=1.26,<2' 'opencv-python-headless>=4.10,<5' 'pytesseract>=0.3.13' 'PyMuPDF>=1.28.0,<2' 'Pillow>=10.3' 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' 'pdf2docx>=0.5.8,<0.6'
      - name: Compile Python source
        run: python -m py_compile main.py pdf_tools.py searchable_pdf.py redaction.py document_export.py pdf_security.py pdf_to_docx.py pdf_image_tools.py request_limits.py document_layout.py text_style.py paddle_vl_client.py
      - name: Test API and document features
        run: python -m unittest discover -s tests -v
      - name: Prepare real Arabic PDF and verify both Word export paths
        run: |
          python -m pip install 'requests>=2.31,<3'
          python tests/e2e/prepare_real_fixture.py
          python tests/e2e/real_pdf_to_docx.py
          python tests/e2e/layout_matrix.py
      - name: Upload real PDF-to-Word validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-arabic-pdf-to-docx-results
          path: tests/e2e/artifacts/
          if-no-files-found: ignore


  ui-device-emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium emulator
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run responsive UI emulation
        run: |
          mkdir -p artifacts
          node tests/ui/emulate-toolbar.mjs
          node tests/ui/compare-local.mjs
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfalqi-ui-device-emulation
          path: artifacts/
          if-no-files-found: ignore

  frontend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate frontend scripts and local assets
        run: node scripts/check_frontend.mjs
