name: Python checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "chore/**"]

jobs:
  syntax-and-ocr-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF test dependencies and Arabic font
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core libraqm0 libharfbuzz0b libfribidi0
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9' 'numpy>=1.26,<2' 'opencv-python-headless>=4.10,<5' 'pytesseract>=0.3.13' 'PyMuPDF>=1.28.0,<2' 'Pillow>=10.3' 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' 'pdf2docx>=0.5.8,<0.6'
      - name: Compile Python source
        run: python -m py_compile main.py pdf_tools.py searchable_pdf.py redaction.py document_export.py pdf_security.py pdf_to_docx.py pdf_image_tools.py request_limits.py document_layout.py
      - name: Test API and document features
        run: python -m unittest discover -s tests -v

  frontend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate frontend scripts and local assets
        run: node scripts/check_frontend.mjs
