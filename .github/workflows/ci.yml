name: Python checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "chore/**"]

jobs:
  syntax-and-ocr-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile main.py
      - name: Test OCR reading order
        run: python -m unittest discover -s tests -v

  frontend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate frontend scripts and local assets
        run: node scripts/check_frontend.mjs
