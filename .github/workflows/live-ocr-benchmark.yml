name: Live Arabic OCR benchmark
on:
  push:
    branches: [main]
    paths:
      - "scripts/live_ocr_public_benchmark.py"
      - "main.py"
      - "Dockerfile.free"
      - "render.yaml"
      - ".github/workflows/live-ocr-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-public-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark client
        run: python -m pip install --disable-pip-version-check requests pymupdf pdf2docx python-docx pillow
      - name: Test real public PDFs, page images and a real scan against Render
        env:
          OCR_API_BASE: https://got-pdf.onrender.com
        run: python scripts/live_ocr_public_benchmark.py
      - name: Upload OCR results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-arabic-ocr-results
          path: live-ocr-results.json
          if-no-files-found: ignore
