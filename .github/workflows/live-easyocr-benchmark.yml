name: EasyOCR Arabic alternative benchmark
on:
  push:
    branches: [main]
    paths:
      - "scripts/live_easyocr_benchmark.py"
      - ".github/workflows/live-easyocr-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: got-pdf-easyocr-benchmark
  cancel-in-progress: false
jobs:
  easyocr-real-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU OCR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1+cpu torchvision==0.22.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install easyocr requests pymupdf pillow
      - name: Benchmark EasyOCR on authentic Arabic PDF and scan
        run: python scripts/live_easyocr_benchmark.py
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easyocr-arabic-results
          path: easyocr-live-results.json
          if-no-files-found: ignore
