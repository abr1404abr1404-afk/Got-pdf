name: Surya Arabic OCR alternative benchmark
# Manual real-document comparison run.
on:
  push:
    branches: [main]
    paths:
      - "scripts/live_surya_benchmark.py"
      - ".github/workflows/live-surya-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: got-pdf-surya-benchmark
  cancel-in-progress: false
jobs:
  surya-real-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install llama.cpp server and CPU inference runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --config Release -j2 --target llama-server
          echo "/tmp/llama.cpp/build/bin" >> $GITHUB_PATH
          echo "LLAMA_CPP_BINARY=/tmp/llama.cpp/build/bin/llama-server" >> $GITHUB_ENV
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1+cpu torchvision==0.22.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install surya-ocr==0.22.0 requests pymupdf pillow
      - name: Benchmark Surya on authentic Arabic PDF and scan
        run: python scripts/live_surya_benchmark.py
      - name: Upload Surya benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surya-arabic-results
          path: surya-live-results.json
          if-no-files-found: ignore
